<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VDI Tool: log in</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; }
  .login { width: min(360px, calc(100vw - 32px)); }
  .login h1 { font-size: 20px; margin: 0 0 4px; }
  .login form { display: grid; gap: 12px; margin-top: 16px; }
  .login input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; }
  .login .err { color: var(--bad); min-height: 20px; font-size: 13px; }
</style>
</head>
<body>
<div class="card login">
  <h1><span class="logo">&#9635;</span> VDI Tool</h1>
  <div class="hint">Enter the admin password to continue.</div>
  <form id="f">
    <input name="password" type="password" placeholder="Admin password" autocomplete="current-password" required autofocus>
    <button class="btn primary">Log in</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: e.target.password.value }) });
  if (r.ok) { location.href = "/"; return; }
  const j = await r.json().catch(() => ({}));
  document.getElementById("err").textContent = j.detail || "Could not log in.";
});
</script>
</body>
</html>
